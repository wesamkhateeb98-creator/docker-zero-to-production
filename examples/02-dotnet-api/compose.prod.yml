# Production: images come from the registry, never built on the server.
#   IMAGE_TAG=sha-abc1234 docker compose -f compose.prod.yml up -d
name: notes

x-logging: &logging
  driver: local
  options: { max-size: "10m", max-file: "3" }

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api: { condition: service_healthy }
    logging: *logging

  api:
    image: ${REGISTRY:?set REGISTRY in .env}/notes-api:${IMAGE_TAG:?set IMAGE_TAG}
    restart: unless-stopped
    environment:
      ConnectionStrings__Redis: redis:6379
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
    secrets:
      - source: db_connection
        target: ConnectionStrings__Db
    volumes: ["dpkeys:/app/keys"]
    stop_grace_period: 30s
    deploy:
      resources:
        limits: { memory: 512M, cpus: "1.0" }
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    logging: *logging

  migrator:
    image: ${REGISTRY}/notes-migrator:${IMAGE_TAG}
    profiles: ["tools"]            # only runs via: docker compose run --rm migrator
    secrets:
      - source: db_connection
        target: ConnectionStrings__Db
    depends_on:
      db: { condition: service_healthy }
    logging: *logging

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: notes
      POSTGRES_USER: notes
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets: [db_password]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notes -d notes"]
      interval: 5s
      retries: 20
    deploy:
      resources:
        limits: { memory: 512M }
    logging: *logging
    # no ports: reachable only from the "notes_default" network

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: ["redis-server", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 20
    deploy:
      resources:
        limits: { memory: 128M }
    logging: *logging

secrets:
  db_password:
    file: ./secrets/db_password.txt
  db_connection:
    file: ./secrets/db_connection.txt

volumes:
  pgdata:
  dpkeys:
  caddy_data:
  caddy_config:
