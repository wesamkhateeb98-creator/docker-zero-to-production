# Build → scan → push → zero-downtime deploy.
# Place at the ROOT of the API's own repository (GitHub only runs root .github/workflows).
#
# Repository secrets:
#   VPS_HOST         server IP / hostname
#   VPS_SSH_KEY      private key of the "deploy" user
#   VPS_KNOWN_HOSTS  output of: ssh-keyscan -H <VPS_HOST>
name: build-and-deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io/${{ github.repository_owner }}
  TAG: sha-${{ github.sha }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build api (cached across runs)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          load: true
          build-args: APP_VERSION=${{ env.TAG }}
          tags: ${{ env.REGISTRY }}/notes-api:${{ env.TAG }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build migrator
        uses: docker/build-push-action@v6
        with:
          context: .
          target: migrator
          load: true
          tags: ${{ env.REGISTRY }}/notes-migrator:${{ env.TAG }}
          cache-from: type=gha,scope=api

      - name: Scan — fail on fixable CRITICAL CVEs
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:latest \
            image --scanners vuln --severity CRITICAL --ignore-unfixed --exit-code 1 \
            "$REGISTRY/notes-api:$TAG"

      - name: Push
        run: |
          docker push "$REGISTRY/notes-api:$TAG"
          docker push "$REGISTRY/notes-migrator:$TAG"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: production
    concurrency: production          # never two deploys at once
    steps:
      - name: Zero-downtime rollout over SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          HOST: ${{ secrets.VPS_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          # shellcheck disable=SC2029  # $TAG is meant to expand here, on the runner
          ssh "deploy@$HOST" "cd ~/notes && ./rollout.sh $TAG"
